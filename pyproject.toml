[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-web-scraper-api"
version = "0.1.0"
description = "Web scraper API for Python and the command line: any page to clean Markdown, HTML or text, every URL of a site from its sitemaps, and full site crawls to Markdown for LLMs and RAG. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["web-scraper", "web-scraper-api", "web-scraping", "website-crawler", "web-crawler", "web-crawler-python", "sitemap-extractor", "url-extractor", "html-to-markdown", "markdown", "llm", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
web-scraper = "quanticdata_web_scraper_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/web-scraping-api/?utm_source=github&utm_medium=pypi&utm_campaign=web-scraper-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/web-scraper-api"
Issues = "https://github.com/quantumproxies/web-scraper-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_web_scraper_api" = ["spec.json", "py.typed"]
